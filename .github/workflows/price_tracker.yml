name: Price tracker

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and evaluate without writing state or sending alerts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          FETCH_BACKENDS: ${{ vars.FETCH_BACKENDS || 'direct,scraperapi,zenrows' }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS || 'telegram,discord' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_DROP_ABS: ${{ vars.MIN_DROP_ABS || '2000' }}
          MIN_DROP_PCT: ${{ vars.MIN_DROP_PCT || '0.03' }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '24' }}
          FAILURE_ALERT_THRESHOLD: ${{ vars.FAILURE_ALERT_THRESHOLD || '3' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python scraper.py --debug-dump $FLAGS

      - name: Upload debug HTML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit state updates
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker_state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update tracker state [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
